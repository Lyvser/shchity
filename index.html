<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Паспорт электрощита</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBE7; --plate:#F7F8F5; --module:#DCDFDA; --ink:#1F2428; --muted:#5E666D;
  --tag:#F2C230; --tag-ink:#1F2428; --wire:#2F6FB5; --line:#C9CDC7; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --plate:#1E2226; --module:#2A2F34; --ink:#E8EBEA; --muted:#9AA3AA;
    --tag:#E8B923; --tag-ink:#15181B; --wire:#5B9BE0; --line:#343A40; --danger:#F2867E;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B; --plate:#1E2226; --module:#2A2F34; --ink:#E8EBEA; --muted:#9AA3AA;
  --tag:#E8B923; --tag-ink:#15181B; --wire:#5B9BE0; --line:#343A40; --danger:#F2867E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
main.wide{max-width:860px}
h1{font-size:clamp(30px,8vw,42px);line-height:1.1;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:20px;font-weight:800;margin:36px 0 12px}
.sub{color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:22px}
.facts div{background:var(--plate);padding:10px 12px}
.facts span{display:block;font-size:13px;color:var(--muted)}
.facts b{font-weight:600}
.master{background:var(--plate);border-left:4px solid var(--wire);padding:16px 16px 18px;margin-top:22px;border-radius:0 6px 6px 0}
.master p{margin:0 0 12px}
.master strong{font-size:19px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 30%;min-width:100px;text-align:center;text-decoration:none;font-weight:600;font:inherit;font-weight:600;
  padding:12px 10px;border-radius:6px;background:var(--module);color:var(--ink);border:0;cursor:pointer}
.btn.main{background:var(--wire);color:#fff}
.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.rail{list-style:none;margin:0;padding:0;border-top:3px solid var(--module)}
.rail li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:12px 4px;border-bottom:1px solid var(--line)}
.tag{background:var(--tag);color:var(--tag-ink);font-weight:800;font-size:14px;
  padding:3px 8px;border-radius:3px;min-width:52px;text-align:center}
.rail .what{font-weight:500}
.rail .dev{display:block;font-size:14px;color:var(--muted)}
.rail .rate{font-weight:800;font-size:15px}
.note{color:var(--muted);font-size:15px;margin:10px 0 0}
.tips{margin:0;padding-left:20px}
.tips li{margin-bottom:8px}
.review{display:block;margin-top:36px;text-align:center;padding:14px;border:2px solid var(--ink);
  border-radius:6px;color:var(--ink);font-weight:600;text-decoration:none}
footer{margin-top:28px;color:var(--muted);font-size:14px;text-align:center}
.edit-open{display:block;margin:28px auto 0;background:none;border:1px dashed var(--muted);color:var(--muted);
  font:inherit;font-size:15px;padding:8px 16px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<main id="app"><p class="sub">Загрузка…</p></main>
<script>
(function(){
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fail(msg){
  app.innerHTML = '<h1>Паспорт не найден</h1><p class="sub">' + esc(msg) + '</p>';
}

function render(DATA){
  const m = DATA.master || {};
  const groups = Array.isArray(DATA.groups) ? DATA.groups : [];
  const tel = (m.phone || "").replace(/[^\d+]/g, "");
  document.title = "Электрощит № " + (DATA.number || "");
  app.innerHTML = `
  <h1>Электрощит № ${esc(DATA.number)}</h1>
  ${DATA.object ? `<p class="sub">${esc(DATA.object)}</p>` : ""}
  ${DATA.date ? `<div class="facts"><div><span>Собран</span><b>${esc(DATA.date)}</b></div></div>` : ""}
  <div class="master">
    <p>Щит собрал <strong>${esc(m.name)}</strong>. Есть вопросы по щиту — звоните или пишите.</p>
    <div class="btns">
      <a class="btn main" href="tel:${esc(tel)}">Позвонить</a>
      <a class="btn" href="https://t.me/${m.telegram ? esc(m.telegram) : esc(tel)}">Telegram</a>
      <a class="btn" href="viber://chat?number=${encodeURIComponent(tel)}">Viber</a>
    </div>
  </div>
  <h2>Что за что отвечает</h2>
  <ul class="rail">
    ${groups.map(g => `
      <li>
        <span class="tag">${esc(g[0])}</span>
        <span><span class="what">${esc(g[1])}</span><span class="dev">${esc(g[2])}</span></span>
        <span class="rate">${esc(g[3])}</span>
      </li>`).join("")}
  </ul>
  <p class="note">Обозначения совпадают с наклейками на автоматах в щите.</p>
  <h2>Как пользоваться</h2>
  <ul class="tips">
    <li>Раз в год нужно протягивать все винтовые соединения в щите. От нагрева и остывания винты со временем ослабевают, а слабый контакт греется — это одна из самых частых причин неисправностей и пожаров в электропроводке. Мастер сделает это за пару часов, звоните.</li>
    <li>Если автомат отключается снова и снова, не держите его рукой и не меняйте на более мощный. Это признак неисправности в линии.</li>
    <li>Реле напряжения отключает питание при скачках в сети и само включает его обратно, когда напряжение приходит в норму.</li>
    <li>Не закрывайте щит мебелью и не храните в нём вещи — щиту нужен доступ и воздух.</li>
  </ul>
  ${m.olx ? `<a class="review" href="${esc(m.olx)}">Оставить отзыв о работе</a>` : ""}
  <footer>${esc(m.name)}, сборка электрощитов в Одессе</footer>
  `;
}

const n = new URLSearchParams(location.search).get("n") || "";
if (!/^[A-Za-z0-9._-]{1,40}$/.test(n)) { fail("В ссылке не указан номер щита."); return; }
fetch("data/" + encodeURIComponent(n) + ".json?v=" + Date.now(), {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
  .then(render)
  .catch(() => fail("Данные щита № " + n + " не найдены. Если паспорт только что обновили, подождите пару минут и обновите страницу."));
})();
</script>
</body>
</html>
